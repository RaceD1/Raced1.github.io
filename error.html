        padding-top: 0;
      }

        font-size: clamp(8rem, 20vw, 14rem);

        -webkit-text-stroke: 2px var(--color-primary);

        margin-bottom: var(--space-lg);
        user-select: none;
      }

      .error__code::after {
        content: "404";
        position: absolute;
        top: 4px;
        left: 4px;
        right: 0;
        color: transparent;
        -webkit-text-stroke: 1px rgba(198, 21, 28, 0.15);
        z-index: -1;
      }
