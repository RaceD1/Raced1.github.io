<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Race Diwan | Coming Soon</title>
    <meta name="description" content="Race Diwan — The motorsport ecosystem built for the Middle East. Coming soon." />

    <meta property="og:title" content="Race Diwan | Coming Soon"/>
    <meta property="og:description" content="The motorsport ecosystem built for the Middle East. Coming soon." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://raced1.com"/>

    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" href="/assets/images/logos/favicon.ico" type="image/x-icon" />
    <link rel="preload" href="./assets/images/background/Traditional_majlis_compressed.webp" as="image" type="image/webp">
    <style>

      html {
        background-color: #000000 !important;
      }
      
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow: hidden;
        background-color: #000000 !important;
      }
      
      .bg-image {
        position: fixed;
        inset: 0;
        background-image: url('./assets/images/background/Traditional_majlis_compressed.webp');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
      }

      .bg-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1;
      }

      main {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        align-items: center;
        padding-top: 0;
        color: #FFFFFF;
      }

      footer {
        position: relative;
        z-index: 2;
      }

      .hero__tagline {
        color: var(--color-secondary);
      }
      
      .hero__description {
        color: rgba(255, 255, 255, 0.85);
      }
      
      .footer {
        background-color: transparent !important;
        color: #FFFFFF;
      }
      
      .footer__title {
        color: var(--color-secondary) !important;
      }
      
      .social-icon {
        color: rgba(255, 255, 255, 0.7);
        border-color: rgba(255, 255, 255, 0.3);
      }
      
      .social-icon:hover {
        color: #FFFFFF;
        border-color: #FFFFFF;
        background-color: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <main>
      <div class="container" style="text-align: center; max-width: 700px; margin-inline: auto;">
        <img
          src="/assets/images/logos/Race_D1wan-01-v2.png"
          alt="Race Diwan Logo"
          style="height: 150px; width: auto; margin-bottom: 2rem; margin-inline: auto; display: block; object-fit: contain; flex-shrink: 0;"
        />
        <h1 class="hero__title" style="direction: rtl; color: var(--color-bg);">
          الديوان يُبنى… وقريبًا يُفتح بابه.
        </h1>
        <h3 style="color: var(--color-bg); margin-bottom: var(--space-xl);">
          The Diwan is being built… and soon, its doors will open.
        </h3>
      </div>
    </main>
